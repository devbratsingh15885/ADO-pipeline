apiVersion: apps/v1
kind: Deployment

metadata:
  name: myapp

spec:
  replicas: 4

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
      - name: myapp
        image: devbrat15885/streamflix:v3

        ports:
        - containerPort: 80
